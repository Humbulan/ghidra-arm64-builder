name: Build Ghidra ARM64 Decompiler
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Ghidra 12.1.4
        uses: actions/checkout@v4
        with:
          repository: NationalSecurityAgency/ghidra
          ref: Ghidra_12.1.4_build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip
          echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Fetch Build Dependencies
        run: gradle -I gradle/support/fetchDependencies.gradle -DhideDownloadProgress -DnoEclipse

      - name: Build Native Decompiler for Linux ARM64
        run: gradle buildNatives_linux_arm_64

      - name: Locate decompile binary
        run: find . -name decompile -type f -path "*linux_arm_64*" -exec ls -lh {} \; -exec cp {} ./decompile-output \;

      - name: Upload Decompiler Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-linux-arm64-decompiler
          path: decompile-output

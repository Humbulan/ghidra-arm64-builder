name: Build Ghidra ARM64 Natives

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Ghidra
        uses: actions/checkout@v4
        with:
          repository: 'NationalSecurityAgency/ghidra'
          ref: 'Ghidra_12.1.4_build'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make Gradle Wrapper Executable
        run: chmod +x support/gradle/gradlew

      - name: Build Native Decompiler for Linux ARM64
        run: |
          cd support/gradle
          ./gradlew buildNatives_linux_arm_64

      - name: Upload Decompiler Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-linux-arm64-decompiler
          path: Ghidra/Features/Decompiler/build/os/linux_arm_64/decompile

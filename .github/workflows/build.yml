name: Build Ghidra ARM64 Decompiler

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Ghidra 12.1.4
        uses: actions/checkout@v4
        with:
          repository: NationalSecurityAgency/ghidra
          ref: Ghidra_12.1.4_build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Make Gradle Wrapper Executable & Build Natives
        run: |
          chmod +x gradlew
          ./gradlew buildNatives_linux_arm_64

      - name: Upload Decompiler Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghidra-linux-arm64-decompiler
          path: Ghidra/Features/Decompiler/build/os/linux_arm_64/decompile
